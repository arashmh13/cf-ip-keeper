<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CF IP Keeper — Control Tower</title>
<style>
:root{
  --bg:#0a0e17; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --txt:#e8edf7; --mut:#8b95ab;
  --acc:#38e1c6; --acc2:#7c8cff; --ok:#3ddc84; --bad:#ff5c74; --warn:#ffb454;
  --mono:'Cascadia Code',ui-monospace,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(124,140,255,.14),transparent 60%),
     radial-gradient(900px 600px at -10% 110%,rgba(56,225,198,.10),transparent 55%),var(--bg);
     color:var(--txt);font:14px/1.55 'Segoe UI',Tahoma,system-ui,sans-serif;min-height:100vh;padding:22px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(135deg,rgba(56,225,198,.25),rgba(124,140,255,.25));
  border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px)}
h1{font-size:19px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12.5px;margin-top:1px}
.spacer{flex:1}
.langbtn,.act{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:10px;padding:7px 14px;font-size:12.5px;backdrop-filter:blur(8px);transition:.15s}
.langbtn:hover,.act:hover{background:var(--card2);border-color:rgba(255,255,255,.2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 16px;backdrop-filter:blur(12px)}
.kpi .v{font-size:21px;font-weight:650;margin-top:2px}
.kpi .l{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.kpi .v.ok{color:var(--ok)}.kpi .v.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
  backdrop-filter:blur(12px);transition:.15s;position:relative;overflow:hidden}
.sec:hover{border-color:rgba(255,255,255,.18);transform:translateY(-2px)}
.sec .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 9px rgba(61,220,132,.7)}
.dot.off{background:var(--bad);box-shadow:0 0 9px rgba(255,92,116,.55)}
.sec h3{font-size:14.5px;font-weight:640;flex:1}
.badge{font-size:10px;padding:2.5px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.rows{display:grid;gap:5px;font-size:12.5px}
.rows .r{display:flex;justify-content:space-between;gap:8px}
.rows .k{color:var(--mut)}
.rows .v{font-family:var(--mono);font-size:11.8px;text-align:right}
.v.hi{color:var(--acc)}
.btns{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.act.sm{padding:4.5px 11px;font-size:11.5px;border-radius:8px}
.act.danger:hover{border-color:var(--bad);color:var(--bad)}
.logcard{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(12px);overflow:hidden}
.loghead{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.loghead .t{font-weight:620;font-size:13.5px}
.pill{cursor:pointer;padding:4px 12px;border-radius:20px;font-size:11.5px;border:1px solid var(--line);
  color:var(--mut);transition:.15s;white-space:nowrap}
.pill.on{background:rgba(56,225,198,.13);color:var(--acc);border-color:rgba(56,225,198,.4)}
#logbox{height:340px;overflow-y:auto;padding:12px 15px;font-family:var(--mono);font-size:11.6px;
  background:rgba(0,0,0,.28)}
#logbox div{white-space:pre-wrap;word-break:break-all;padding:1px 0;color:#a9b4c9}
#logbox div.f{color:var(--acc)} #logbox div.e{color:var(--bad)} #logbox div.k{color:var(--warn)}
.livetag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--acc);margin-left:auto}
.livetag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc);
  animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(20,26,40,.95);border:1px solid var(--line);border-radius:12px;padding:10px 20px;
  font-size:13px;transition:.3s;opacity:0;z-index:50;backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%);opacity:1}
footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:22px}
[dir=rtl] .rows .v{text-align:left}
[dir=rtl] #logbox{direction:ltr;text-align:left}
@media(max-width:640px){body{padding:12px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" stroke="#38e1c6" stroke-width="1.6"/>
    <circle cx="12" cy="11" r="2.4" fill="#7c8cff"/><path d="M12 8.6V4.8M12 13.4v3.8" stroke="#7c8cff" stroke-width="1.2" stroke-dasharray="2 2"/>
  </svg></div>
  <div><h1>CF IP Keeper — Control Tower</h1>
  <div class="sub" id="subtitle">relay scanner dashboard · ZimaOS</div></div>
  <div class="spacer"></div>
  <button class="langbtn" id="langbtn">فارسی</button>
</header>

<div class="kpis" id="kpis"></div>
<div class="grid" id="grid"></div>

<div class="logcard">
  <div class="loghead">
    <span class="t" data-i18n="logs">Live logs</span>
    <span class="livetag" data-i18n="live">LIVE</span>
    <div class="spacer"></div>
    <span class="pill on" data-file="scanner.log" data-i18n="iran">Iran</span>
    <span class="pill" data-file="checker.log" data-i18n="checker">Keeper</span>
    <span class="pill" data-file="scanner_Hetzner.log">Hetzner</span>
    <span class="pill" data-file="scanner_AmazonAWS.log">AWS</span>
    <span class="pill" data-file="scanner_Aeza.log">Aeza</span>
    <span class="pill" data-file="scanner_DigitalOcean.log">DO</span>
    <span class="pill" data-file="scanner_EthernetServer.log">Eth</span>
    <span class="pill" data-file="scanner_IONOS.log">IONOS</span>
  </div>
  <div id="logbox"></div>
</div>
<footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
const I18N = {
  en:{dash:"CF IP Keeper — Control Tower",sub:"relay scanner dashboard · ZimaOS",logs:"Live logs",
    live:"LIVE",iran:"Iran",checker:"Keeper",services:"Services",found:"Found IPs",record:"DNS record",
    lastfind:"Last find",cursor:"Scan cursor",workers:"Workers",hotnets:"Hot /24s",hits:"Lifetime hits",
    system:"System",uptime:"Uptime",load:"Load",memory:"Memory",follow:"Following log — live tail",
    started:"running since",notfound:"no record yet",none:"—",foot:"positions resume from disk checkpoints · GFW-vantage validation"},
  fa:{dash:"CF آی‌پی کیپر — برج مراقبت",sub:"داشبورد اسکنر ریلی · زیماآ‌اس",logs:"گزارش زنده",
    live:"زنده",iran:"ایران",checker:"نگهبان",services:"سرویس‌ها",found:"آی‌پی‌های سالم",
    record:"رکورد DNS",lastfind:"آخرین یافته",cursor:"مکان اسکن",workers:"ورکرها",
    hotnets:"شبکه‌های داغ",hits:"یافته‌های کل",system:"سیستم",uptime:"کارکرد",
    load:"بار",memory:"حافظه",follow:"دنبال کردن گزارش زنده…",started:"فعال از",
    notfound:"هنوز رکوردی ثبت نشده",none:"—",foot:"ادامه از آخرین چک‌پوینت · اعتبارسنجی از دید کاربر"}
};
let lang = localStorage.getItem("cfk_lang") || "en";
const T = k => (I18N[lang][k] ?? I18N.en[k] ?? k);

let ES = null, curFile = "scanner.log", follow = true;
const $ = s => document.querySelector(s);
const box = $("#logbox");

function applyLang(){
  document.documentElement.lang = lang;
  document.body.dir = lang === "fa" ? "rtl" : "ltr";
  $("#langbtn").textContent = lang === "fa" ? "English" : "فارسی";
  document.querySelector("h1").textContent = T("dash");
  $("#subtitle").textContent = T("sub");
  $("#foot").textContent = T("foot");
  document.querySelectorAll(".livetag").forEach(e => e.childNodes.length && (e.textContent = T("live")));
  document.querySelectorAll('[data-i18n]').forEach(e => { if(I18N[lang][e.dataset.i18n]) e.textContent = T(e.dataset.i18n); });
  render(statusData); // re-render labels
}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

async function action(section, act){
  toast("⏳ " + section + " → " + act);
  try{
    const r = await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({section,action:act})});
    const j = await r.json();
    toast(j.ok ? "✅ " + section + " [" + j.state + "]" : "⚠️ " + (j.out||j.error||j.state));
    refresh();
  }catch(e){toast("⚠️ " + e)}
}

function secCard(s){
  const on = s.active === "active";
  const rec = s.record_ip ? `${s.record_ip} <span style="color:var(--mut)">(${s.record_ms}ms)</span>` : `<span style="color:var(--mut)">${T("notfound")}</span>`;
  const cur = `#${s.cursor_i} · +${s.cursor_j}`;
  return `<div class="sec">
    <div class="top"><span class="dot ${on?"on":"off"}"></span><h3>${s.name}</h3>
      <span class="badge">${s.workers?? "?"} w</span></div>
    <div class="rows">
      <div class="r"><span class="k">${T("found")}</span><span class="v hi">${s.found}</span></div>
      <div class="r"><span class="k">${T("record")}</span><span class="v">${rec}</span></div>
      <div class="r"><span class="k">${T("lastfind")}</span><span class="v">${s.last_found ?? T("none")}${s.last_ms?` <span style="color:var(--mut)">· ${s.last_ms}ms</span>`:""}</span></div>
      <div class="r"><span class="k">${T("cursor")}</span><span class="v">${cur} <span style="color:var(--mut)">/ ${s.nets}</span></span></div>
      <div class="r"><span class="k">${T("hotnets")}</span><span class="v">${s.hot_nets} · ${s.hits_total}</span></div>
      ${on && s.since ? `<div class="r"><span class="k">${T("started")}</span><span class="v" style="font-size:10.5px">${s.since.replace(" Iran","+0330")}</span></div>`:""}
    </div>
    <div class="btns">
      <button class="act sm" onclick="action('${s.name}','restart')">${lang==="fa"?"ری‌استارت":"Restart"}</button>
      ${on
        ? `<button class="act sm danger" onclick="action('${s.name}','stop')">${lang==="fa"?"توقف":"Stop"}</button>`
        : `<button class="act sm" onclick="action('${s.name}','start')">${lang==="fa"?"شروع":"Start"}</button>`}
      ${s.name==="Iran"?`<button class="act sm" onclick="action('Iran','check')">${lang==="fa"?"بررسی فوری":"Check now"}</button>`:""}
    </div>
  </div>`;
}

let statusData = null;
function render(d){
  if(!d) return;
  const sys = d.system || {};
  $("#kpis").innerHTML = `
    <div class="kpi"><div class="l">${T("services")}</div>
      <div class="v ${d.active_services===d.total_services?"ok":"bad"}">${d.active_services} / ${d.total_services}</div></div>
    <div class="kpi"><div class="l">${T("found")}</div>
      <div class="v">${d.sections.reduce((a,s)=>a+s.found,0).toLocaleString()}</div></div>
    <div class="kpi"><div class="l">${T("record")}</div>
      <div class="v" style="font-size:13px;font-family:var(--mono)">${d.sections.filter(s=>s.record_ip).length}/${d.sections.length}</div></div>
    <div class="kpi"><div class="l">${T("uptime")}</div><div class="v" style="font-size:16px">${sys.uptime_h??0} h</div></div>
    <div class="kpi"><div class="l">${T("load")}</div><div class="v" style="font-size:16px">${sys.load??"0"}</div></div>
    <div class="kpi"><div class="l">${T("memory")}</div>
      <div class="v" style="font-size:16px">${sys.mem_used_mb??0}<span style="color:var(--mut);font-size:11px">/${sys.mem_total_mb??0}MB</span></div></div>`;
  $("#grid").innerHTML = d.sections.map(secCard).join("");
}

async function refresh(){
  try{
    const r = await fetch("/api/status"); statusData = await r.json(); render(statusData);
  }catch(e){}
}

function setFile(f){
  curFile = f;
  document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on", p.dataset.file===f));
  if(ES){ES.close(); ES=null;}
  box.innerHTML = "";
  ES = new EventSource("/stream?file=" + encodeURIComponent(f));
  ES.onmessage = ev => {
    const ln = JSON.parse(ev.data);
    const div = document.createElement("div");
    if(/FOUND/.test(ln)) div.className="f";
    else if(/ERROR|Traceback|error|fail/i.test(ln)) div.className="e";
    else if(/switched|keeping|keeper|start:|priority|resume/.test(ln)) div.className="k";
    div.textContent = ln.replace(/\s+$/,"");
    box.appendChild(div);
    while(box.children.length > 900) box.removeChild(box.firstChild);
    if(follow) box.scrollTop = box.scrollHeight;
  };
  ES.onerror = () => {};
}

document.querySelectorAll(".pill").forEach(p=>p.onclick=()=>setFile(p.dataset.file));
$("#langbtn").onclick = ()=>{lang = lang==="fa"?"fa":"en";localStorage.setItem("cfk_lang",lang);applyLang();};
box.onscroll = ()=>{follow = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;};

setFile(curFile); refresh(); setInterval(refresh, 10000); applyLang();
</script>
</body>
</html>
